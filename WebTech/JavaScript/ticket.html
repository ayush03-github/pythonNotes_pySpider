<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Ticket</title>
    <link rel="stylesheet" href="ticket.css">
</head>
<body class="page">

    <div class="ticket">

        <!-- Header -->
        <div class="ticket-header">
            <div class="brand">
                <div class="brand-logo">
                    <img src="image.png" alt="Logo">
                </div>
                <h1 class="brand-name">SWISS EXPRESS</h1>
            </div>
            <h1 class="price">$225</h1>
        </div>

        <!-- Route -->
        <div class="route">
            <div class="location">
                <h1>ZUR</h1>
                <h2>Zurich</h2>
            </div>

            <div class="duration">
                <img src="image.png" alt="Train">
                <h2>1h 23m</h2>
            </div>

            <div class="location">
                <h1>LUZ</h1>
                <h2>Luzern</h2>
            </div>
        </div>

        <!-- Passenger -->
        <div class="passenger">
            <div class="passenger-info">
                <img src="image.png" alt="User">
                <div>
                    <h2>GUY HAWKINS</h2>
                    <h3>guy.haw@gmail.com</h3>
                </div>
            </div>

            <div class="seat">
                <h2>Seat</h2>
                <h2>A2</h2>
            </div>
        </div>

        <!-- Details -->
        <div class="details">
            <div>
                <h2>Train No</h2>
                <h2>JWI008</h2>
            </div>
            <div class="text-right">
                <h2>Class</h2>
                <h2>Business</h2>
            </div>
        </div>

        <div class="details">
            <div>
                <h2>Departure</h2>
                <h2>10:30 AM</h2>
            </div>
            <div>
                <h2>Arrival</h2>
                <h2>02:45 PM</h2>
            </div>
        </div>

        <div class="details">
            <div>
                <h2>Terminal</h2>
                <h2>6D</h2>
            </div>
            <div>
                <h2>Gate</h2>
                <h2>B16</h2>
            </div>
        </div>

        <!-- Barcode -->
        <div class="barcode">
            <img src="barcode.png" alt="Barcode">
        </div>

        <!-- Download -->
        <h1 class="download">Download Ticket</h1>

    </div>

</body>
</html>
