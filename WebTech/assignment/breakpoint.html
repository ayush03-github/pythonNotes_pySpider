<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0px;}
        .main{
            height: 100vh;
            width: 100vw;
            background: black;
            position: relative;
        }
        .box{height: 100px; 
            width: 100px;
            background: #fff;
            animation: move 2s infinite;
            position:absolute;
            }

        @keyframes move {
            0%,100%{
                top:0px;
                left:0px;
            }
            25%{
                top:0px;
                left:calc(100% - 100px);
            }
            50%{
                top:calc(100% - 100px);
                left:calc(100% - 100px);

            }75%{
                top:calc(100% - 100px);
                left:0px;
            }
            
        }


        
    </style>
</head>
<body>
    <div class="main">
        <div class="box"></div>
    </div>
</body>
</html>
