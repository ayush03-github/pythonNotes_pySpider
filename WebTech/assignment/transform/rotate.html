<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width:100vw;
            background: rgb(203, 255, 232);
        }
        .main>div{
            height: 200px;
            width:200px; 
            background: white;
            border: 20px solid black;
            border-radius: 30px;
        }
        .a:hover{
            background:black;
            border: 20px solid white;
            transition-property: all;
            transition-delay: 1000ms;
            transition-duration: 1500ms;
            transform: rotateX(90deg);
        }
        .b:hover{
            background:black;
            border: 20px solid white;
            transition-property: all;
            transition-duration: 5000ms;
            transform: rotateY(12000deg);
        }
        .c:hover{
            background:black;
            border: 20px solid white;
            transition-property: all;
            transition-duration: 15000ms;
            transform: rotatez(120000deg) rotatey(360deg) rotatex(12000deg);
            
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="a"></div>
        <div class="b"></div>
        <div style="font-size: 30px;" class="c">I am sooo drunk </div>
        <div class="d"></div>
    </div>
</body>
</html>
