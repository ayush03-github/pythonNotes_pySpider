<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
        .main{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            gap:10px;
        }
        .ball{
            height: 100px;
            width: 100px;
            background: radial-gradient(blue, rgb(0, 0, 80));
            border-radius: 50%;
            position: relative;
            animation: bounce 600ms infinite ease-in-out alternate;
        }

        @keyframes bounce {
            from {
                transform: translateY(0px) ;
            }
            to {
                transform: translateY(-100px) ;
            }
        }

        .ball:nth-child(2){
            animation-delay: 100ms;
        }
        .ball:nth-child(3){
            animation-delay: 200ms;
        }
        .ball:nth-child(4){
            animation-delay: 300ms;
        }
        .ball:nth-child(5){
            animation-delay: 400ms;
        }
        .ball:nth-child(6){
            animation-delay: 500ms;
        }
        .ball:nth-child(7){
            animation-delay: 600ms;
        }
        .ball:nth-child(8){
            animation-delay: 700ms;
        }

        </style>
</head>
<body>
    <div class="main">
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
    </div>

</body>
</html>
