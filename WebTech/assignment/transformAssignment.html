<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0; padding: 0;}
         h1{
            font-size: 10rem;
            color: white;
            display: flex;
            gap: 20px;
        }
        span{
            display: inline-block;
            animation: appear 4.5s linear forwards,fall 3s linear forwards;
        }
        span:nth-child(1) {
            animation-delay: 0.5s,5s;
        }

        span:nth-child(2) {
            animation-delay: 0.5s,5.2s;
        }

        span:nth-child(3) {
            animation-delay: 0.5s,5.4s;
        }

        span:nth-child(4) {
            animation-delay: 0.5s,5.6s;
        }

        span:nth-child(5) {
            animation-delay: 0.5s,5.8s;
        }


        @keyframes appear {
            from {
                opacity: 0;
                transform: translateX(-1000px) translateY(0px);
            }
            to {
                opacity: 1;
                transform: translateX(0px) translateY(0px);
            }
            
        }
        @keyframes fall {
            from {
                transform: translateX(0) translateY(0);
            }
            to {
                transform: translateX(0) translateY(550px);
            }
        }


        </style>
</head>
<body>
    <div style="overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            gap:0px;">
        <h1>
        <span>A</span>
        <span>Y</span>
        <span>U</span>
        <span>S</span>
        <span>H</span>
    </h1>
    </div>
</body>
</html>
