<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        *{margin: 0; padding: 0;}
        .wrapper{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        .wifi{
            height: 100px;
            width: 100px;
            border-radius: 50%;
            background: conic-gradient(from 0deg at 50% 50%, white 0deg, 240deg, red 240deg, red 360deg);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="wifi"></div>
    </div>
</body>
</html>
