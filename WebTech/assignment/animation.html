<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;

        }

        .wrapper{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: aquamarine;
        }

        .box{
            height: 200px;
            width: 200px;
            background: url('image.jpg');
            object-fit: cover;
            animation-name: resize-box;
            animation-duration: 1s;
            /* animation-iteration-count: infinite; */
            animation-fill-mode: none;
            animation-fill-mode: backwards;
            /* animation-fill-mode: forwards; */
        }

        /* .box:hover{
            transform: scale(2);
            transform: all 1000ms;
        } */

        @keyframes resize-box {
            from {
                height: 100px;
                width: 100px;
            }
            to {
                height: 500px;
                width: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="box">
        </div>
    </div>
</body>
</html>
