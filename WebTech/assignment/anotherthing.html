<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: rgb(203, 255, 232);
        }
        .a{
            height: 200px;
            width:200px; 
            background: white;
            border: 50px solid black;
        }
        .a:hover{
            background:black;
            height: 500px;
            width: 500px;
            border: 50px solid white;
            transition-property: all;
            transition-delay: 1000ms;
            transition-duration: 500ms;
        }
    </style>
</head>
<body>
    <div class="a"></div>
</body>
</html>
