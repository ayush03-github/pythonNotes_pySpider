<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0px;}
        body{
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;  
        }
        .container{
            margin-top: 100px;
            height: 80vh;
            width: 80vw;
            background-color: white;
            display: grid;
            grid-template-columns: 300px 300px 300px;
            grid-template-rows:300px 300px 300px ;


            /* grid-template-columns: 1fr 1fr 1fr ;
            grid-template-rows: 1fr 1fr 1fr;

            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,1fr); */

            
        }
        .box{
            height: 100%;
            width: 100%;
            background-color: aquamarine;
            border: 2px solid grey;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .box:nth-child(1){
            background: turquoise;
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 4;
        }
        .box:nth-child(4){
            background: turquoise;
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 2;
            grid-row-end: 4;
        }

        /* .box:nth-child(1){
            background: red;
            grid-column-start: 1;
            grid-column-end: 3;
        } */
    </style>
</head>
<body>
    <div class="container" >
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
    </div>
</body>
</html>
