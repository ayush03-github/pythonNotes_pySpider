<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0px;}
        .container{
            height: 100vh;
            width: 100vw;
            background-color: black;

        }

        .arrow{
            height: 100px;
            width: 100px;
            animation: moveArrow 5s;
            animation-timing-function: linear;
            position: absolute;
        }

        @keyframes moveArrow {
            0%{
                top:calc(100% - 100px);
                transform: rotate(-45deg);
            }
            25%{
                top:0px;
                left:25%;            
                transform: rotate(45deg);
            }
            50%{
                top:calc(100% - 100px);
                left:50%;
                transform: rotate(-45deg);
            }
            75%{
                top:0px;
                left:75%;
                transform: rotate(45deg);
            }
            100%{
                top:calc(100% - 100px);
                left:calc(100% - 100px);
                transform: rotate(-45deg);
            }
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="arrow">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="size-2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3" />
            </svg>
        </div>
    </div>
</body>
</html>
