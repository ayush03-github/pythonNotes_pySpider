<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        div{
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .o-w{
            height: 200px;
            width:200px;
            transform: rotateZ(-45deg);
             
        }
        .o-b{
            height: 170px;
            width:170px;
             
        }
        .m-w{
            height: 140px;
            width:140px;
             
        }
        .m-b{
            height: 110px;
            width:110px;
             
        }
        .iw{
            height: 80px;
            width:80px;
             
        }
        .ib{
            height: 50px;
            width:50px;
             
        }
        .c{
            height: 20px;
            width:20px;
            background-color: white;
        }
        .o{
            background: conic-gradient(from 0deg , rgb(2, 2, 2) 90deg, transparent 90deg)
        }
        .e{background: conic-gradient(from 0deg , rgb(255, 255, 255) 90deg, transparent 90deg)}
    </style>
</head>
<body>
    <div class="o-w e">
        <div class="o-b o">
            <div class="m-w e">
                <div class="m-b o">
                    <div class="iw e">
                        <div class="ib o">
                            <div class="c"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
