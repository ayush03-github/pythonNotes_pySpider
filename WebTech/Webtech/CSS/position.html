<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style> 
        body{
            margin: 0px;
            background-color: black;
        }
        .container{ 
            margin: 200px auto;           
            background-color: springgreen;
            height: 70vh;
            width: 70vw;
            border: 5px solid rgb(255, 255, 255);
            display: flex;
            /* justify-content: space-evenly; */
            /* align-items: center; */
            /* flex-direction: column; */
            /* flex-direction: column-reverse; */
            /* flex-direction: row-reverse; */
            /* flex-direction: row; */

            align-items: center;
            /* align-items: end; */

            /* justify-content: center; */
            /* justify-content: start; */
            /* justify-content: flex-start; */
            /* justify-content: space-around; */
            /* justify-content: space-between; */
            justify-content: space-evenly;

            /* flex-wrap: wrap;
            flex-wrap: nowrap;
            flex-wrap: wrap-reverse; */


        }
        .container>.box{
            height: 200px;
            width: 200px;
            margin: 5px;
            background-color:rgb(255, 175, 175) ;
            border-radius: 100px 0px 0px 0px;   
            border: 3px solid black; 
            font-size: 32px;
            font-weight: 900;
        }


        .wrapper{
            height:1000px;
            width:1000px;
            background:aliceblue;
            position: relative;
        }
        .wrapper>.box{
            height: 200px;
            width: 200px;
            margin: 5px;
            background-color:rgb(255, 175, 175) ;
            border-radius: 100px 0px 0px 0px;   
            border: 3px solid black; 
            font-size: 32px;
            font-weight: 900;
        }

        .wrapper>.box:nth-child(1){
            position: absolute;
            top: 100px;
        }

        .box:nth-child(1){
            background-color: red;
        }
        .box:nth-child(2){
            background-color: blue;
        }
        .box:nth-child(3){
            background-color: green;
        }
        .box:nth-child(4){
            background-color: yellow;
        }</style>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div class="wrapper">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

</body>
</html>
