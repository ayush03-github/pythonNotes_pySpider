<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background: rgb(255, 255, 255);
        }
        div {
            width: 200px;
            height: 200px;
            margin: 20px auto;
        }

        #outer-shadow {
            background-color: rgb(82, 198, 240);
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 100px;
        }

        #second-outer {
            background-color: rgb(240, 82, 198);
            box-shadow:black 0px 0px 50px;}

        #circular {
            background-color: rgb(220, 220, 220);
            box-shadow: inset 0px 0px 10px 10px grey;
            border-radius: 20px;
        }

        #multi-shadow {
            box-shadow: 10px 10px 5px red,
                        -10px -10px 5px green,
                        10px -10px 5px blue,
                        10px 10px 5px yellow;
        }

        #test{
            box-shadow:inset 0 10px 10px -10px rgba(93, 93, 93, 0.6),  /* top */
                        inset 0 -10px 10px -10px rgba(93, 93, 93, 0.6), /* bottom */
                        inset 10px 0 10px -10px rgba(93, 93, 93, 0.6),  /* left */
                        inset -10px 0 10px -10px rgba(93, 93, 93, 0.6); /* right */
                        border-radius: 25%;
        }



        </style>
</head>
<body>
    <div id="outer-shadow"></div>
    <div id="second-outer"></div>
    <div id="multi-shadow"></div>
    <div id="circular"></div>
    <div id="test"></div>

<hr>
    <div style="display: flex; margin: 0px; justify-content: space-around; width: 100vw;">
    <img style="filter: drop-shadow(0px 10px 10px rgb(255, 0, 0));" src="aboutme.png" alt="about me">
    <img src="aboutme.png" alt="about me">
    '
    '
    </div>
</body>
</html>
