<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>

    <marquee behavior="" direction="down" bgcolour="lightskyblue" height="300px"><h1>i ❤️ 🐍spiders</h1></marquee>

    <marquee behavior="" direction="left" scrollamount="'20"><h1>i ❤️ 🐍spiders</h1></marquee>
